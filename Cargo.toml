[package]
name = "efi-bank"
version = "0.1.26"
edition = "2024"
description = "A SDK for interacting with the EFI Bank."
license = "MIT"
repository = "https://github.com/wuzi/efi-bank"
readme = "README.md"
keywords = ["sdk", "payments", "efi"]
categories = ["network-programming"]

[dependencies]
reqwest = { version = "0.12.24", default-features = false, features = [
  "json",
  "native-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serde_with = "3.16.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
h2 = "0.4"
reqwest = { version = "0.12.24", default-features = false, features = ["http2"] }
